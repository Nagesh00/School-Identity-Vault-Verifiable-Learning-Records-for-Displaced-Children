version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: school-identity-vault-db
    environment:
      POSTGRES_DB: school_identity_vault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: school-identity-vault-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: school_identity_vault
      DB_USER: postgres
      DB_PASSWORD: postgres
      AZURE_VISION_KEY: ${AZURE_VISION_KEY}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      BLOCKCHAIN_RPC_URL: http://blockchain:8545
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
    networks:
      - school-identity-vault-network

  # ML Engine
  ml-engine:
    build:
      context: ./ml-engine
      dockerfile: Dockerfile
    container_name: school-identity-vault-ml
    environment:
      AZURE_VISION_KEY: ${AZURE_VISION_KEY}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./ml-engine/src:/app/src
    networks:
      - school-identity-vault-network
    depends_on:
      - backend

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: school-identity-vault-frontend
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_ML_ENGINE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - school-identity-vault-network

  # Redis Cache (optional)
  redis:
    image: redis:7-alpine
    container_name: school-identity-vault-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school-identity-vault-network

volumes:
  postgres_data:

networks:
  school-identity-vault-network:
    driver: bridge
